version: "3.9"

services:
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python services/catalog_service/main.py
    ports:
      - "8001:8001"

  warehouse-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python services/warehouse_service/main.py
    ports:
      - "8002:8002"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python services/order_service/main.py
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8002
    ports:
      - "8003:8003"
    depends_on:
      - catalog-service
      - warehouse-service

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python services/analytics_service/main.py
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
    ports:
      - "8004:8004"
    depends_on:
      - catalog-service
      - warehouse-service
      - order-service

  gateway-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python gateway_frontend/main.py
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
      - ANALYTICS_SERVICE_URL=http://analytics-service:8004
    ports:
      - "8000:8000"
    depends_on:
      - catalog-service
      - warehouse-service
      - order-service
      - analytics-service
